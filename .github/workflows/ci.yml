name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q jwc24 tools
      - name: Validate package metadata
        run: python -m pip install --no-deps .
      - name: Install offline test dependencies
        run: python -m pip install ".[artwork,reverse-engineering]" pycryptodome
      - name: Run available offline regressions
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests
