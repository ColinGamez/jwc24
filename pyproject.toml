[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jwc24"
version = "0.1.0"
description = "Experimental replacement-service toolkit for Japanese WiiConnect24 channels"
requires-python = ">=3.11"

[project.optional-dependencies]
artwork = ["Pillow", "qrcode"]
reverse-engineering = ["capstone>=5,<6", "unicorn>=2.1,<3"]

[project.scripts]
jwc24 = "jwc24.__main__:main"

[tool.setuptools.packages.find]
include = ["jwc24*"]
